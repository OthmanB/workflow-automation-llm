name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  quality:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-python@v6
        with:
          python-version: "3.11"
          cache: pip
      - name: Install development dependencies
        run: python -m pip install -e ".[dev]"
      - name: Lint
        run: ruff check src tests
      - name: Type check
        run: mypy src
      - name: Test
        run: pytest
      - name: Scan repository for secrets
        uses: gitleaks/gitleaks-action@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      - name: Audit Python dependencies
        run: pip-audit --strict .
      - name: Build wheel and source distribution
        run: python -m build
      - name: Verify distribution metadata
        run: twine check --strict dist/*
      - name: Install wheel in a clean environment
        run: |
          python -m venv /tmp/dispatcher-wheel
          /tmp/dispatcher-wheel/bin/python -m pip install dist/*.whl
          /tmp/dispatcher-wheel/bin/python -m pip check
      - name: Smoke-test installed CLI outside the checkout
        working-directory: /tmp
        run: /tmp/dispatcher-wheel/bin/dispatcher --help
      - name: Verify packaged bootstrap template
        working-directory: /tmp
        run: |
          /tmp/dispatcher-wheel/bin/python -c 'import os; from importlib import resources; from pathlib import Path; text = resources.files("dispatcher").joinpath("templates/bootstrap_supervisor.md").read_text(); source = Path(os.environ["GITHUB_WORKSPACE"]) / "src/dispatcher/templates/bootstrap_supervisor.md"; assert text == source.read_text()'
