[project]
name = "dispatcher"
version = "0.1.0"
description = "Automated supervisor → executor → reviewer loop over persistent opencode sessions"
readme = "README.md"
license = "Apache-2.0"
requires-python = ">=3.11"
dependencies = [
    "pydantic>=2.12,<3",
    "psutil>=6,<7",
    "pyyaml>=6",
]

[project.urls]
Repository = "https://github.com/OthmanB/workflow-automation-llm"

[project.optional-dependencies]
dev = [
    "build>=1.2,<2",
    "hypothesis>=6.100,<7",
    "mypy>=1.17,<2",
    "pip-audit>=2.8,<3",
    "pytest>=8.4,<9",
    "ruff>=0.12,<1",
    "twine>=6,<7",
    "types-pyyaml>=6.0.12",
    "types-psutil>=6,<8",
]

[project.scripts]
dispatcher = "dispatcher.cli:main"

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.package-dir]
"dispatcher" = "src/dispatcher"

[tool.setuptools.package-data]
"dispatcher" = ["templates/*.md"]

[tool.pytest.ini_options]
addopts = ["--strict-config", "--strict-markers", "-ra"]
testpaths = ["tests"]
pythonpath = ["tests"]
xfail_strict = true
markers = ["live_opencode: explicitly enabled read-only OpenCode compatibility smoke"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F", "I", "B"]

[tool.mypy]
python_version = "3.11"
check_untyped_defs = true
disallow_untyped_defs = true
no_implicit_optional = true
warn_redundant_casts = true
warn_unused_configs = true
warn_unused_ignores = true

[tool.dispatcher.opencode]
supported-version = "1.18.11"
fixture-path = "tests/fixtures/opencode/1.18.11"
source-tag = "v1.18.11"
